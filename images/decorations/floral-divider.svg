<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" width="500" height="50">
  <defs>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C5A880" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9A7B56" stop-opacity="1"/>
      <stop offset="75%" stop-color="#C5A880" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Horizontal tapered lines -->
  <line x1="50" y1="25" x2="200" y2="25" stroke="url(#goldLine)" stroke-width="1.5" />
  <line x1="300" y1="25" x2="450" y2="25" stroke="url(#goldLine)" stroke-width="1.5" />

  <!-- Center Diamond & Laurel leaves -->
  <g fill="#A68352" stroke="#9A7B56" stroke-width="0.5">
    <!-- Center diamond -->
    <polygon points="250,17 257,25 250,33 243,25" />
    <circle cx="235" cy="25" r="2.5" />
    <circle cx="265" cy="25" r="2.5" />
    <circle cx="225" cy="25" r="1.5" />
    <circle cx="275" cy="25" r="1.5" />

    <!-- Left delicate curl -->
    <path d="M 215 25 C 210 20, 205 28, 200 24 C 205 22, 210 23, 215 25 Z" />
    <!-- Right delicate curl -->
    <path d="M 285 25 C 290 20, 295 28, 300 24 C 295 22, 290 23, 285 25 Z" />
  </g>
</svg>
