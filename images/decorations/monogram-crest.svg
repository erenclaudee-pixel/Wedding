  <!-- Center Monogram -->
  <text x="150" y="165" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', serif" font-size="52" font-weight="600" letter-spacing="4" fill="#9A7B56" text-anchor="middle">A &amp; S</text>
  <line x1="110" y1="180" x2="190" y2="180" stroke="#C29B63" stroke-width="1" opacity="0.6"/>
