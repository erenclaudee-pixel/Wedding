<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="luxLiner" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#FDFBF7"/>
      <!-- Soft gold damask foliage -->
      <path d="M 40 10 C 35 25, 25 35, 10 40 C 25 45, 35 55, 40 70 C 45 55, 55 45, 70 40 C 55 35, 45 25, 40 10 Z" fill="#F2E6D2" opacity="0.8"/>
      <circle cx="40" cy="40" r="4" fill="#DEC398"/>
      <path d="M 0 0 C 10 10, 20 10, 25 0 Z" fill="#E8D5B8" opacity="0.5"/>
      <path d="M 80 0 C 70 10, 60 10, 55 0 Z" fill="#E8D5B8" opacity="0.5"/>
      <path d="M 0 80 C 10 70, 20 70, 25 80 Z" fill="#E8D5B8" opacity="0.5"/>
      <path d="M 80 80 C 70 70, 60 70, 55 80 Z" fill="#E8D5B8" opacity="0.5"/>
      <circle cx="0" cy="0" r="3" fill="#DEC398"/>
      <circle cx="80" cy="0" r="3" fill="#DEC398"/>
      <circle cx="0" cy="80" r="3" fill="#DEC398"/>
      <circle cx="80" cy="80" r="3" fill="#DEC398"/>
    </pattern>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="20%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#luxLiner)"/>
  <rect width="600" height="400" fill="url(#vignette)"/>
</svg>

