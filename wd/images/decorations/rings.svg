<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" width="100" height="70">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB8" />
      <stop offset="50%" stop-color="#C5A065" />
      <stop offset="100%" stop-color="#835F2B" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="50%" stop-color="#D4B07B" />
      <stop offset="100%" stop-color="#8F6B37" />
    </linearGradient>
    <filter id="diamondShine">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FFF8E0" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Left Ring -->
  <circle cx="38" cy="38" r="22" fill="none" stroke="url(#gold1)" stroke-width="5" />
  
  <!-- Right Ring Interlocking -->
  <circle cx="62" cy="38" r="22" fill="none" stroke="url(#gold2)" stroke-width="5" />

  <!-- Solitaire Diamond on Right Ring -->
  <g transform="translate(62, 16)" filter="url(#diamondShine)">
    <!-- Prongs -->
    <path d="M -4 2 L 0 -5 L 4 2" stroke="#B89758" stroke-width="1.5" fill="none"/>
    <!-- Diamond Gem -->
    <polygon points="0,-8 6,-3 4,2 -4,2 -6,-3" fill="#FFFFFF" stroke="#C5A065" stroke-width="0.8"/>
    <!-- Diamond facets -->
    <line x1="0" y1="-8" x2="0" y2="2" stroke="#E6EEF8" stroke-width="0.6"/>
    <line x1="-6" y1="-3" x2="6" y2="-3" stroke="#D1E2F6" stroke-width="0.6"/>
    <!-- Sparkle -->
    <polygon points="0,-12 1,-9 4,-8 1,-7 0,-4 -1,-7 -4,-8 -1,-9" fill="#FFF9E6"/>
  </g>
</svg>

